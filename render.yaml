# Render.com Blueprint
# Deploy this directory as a Web Service on Render.

services:
  - type: web
    name: tubeinspect-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
    autoDeploy: true
